name: Bug report
description: Something Zeus did that it should not have
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues do **not** belong here — see
        [SECURITY.md](https://github.com/mjrafg/zeus/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what Zeus did.
      placeholder: |
        $ zeus run "..."
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: zeus doctor
      description: Output of `zeus doctor`. Redact anything you would rather not share.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `zeus version`.
    validations:
      required: true
  - type: textarea
    id: project
    attributes:
      label: Project
      description: Language, build tooling, and anything unusual about the repository.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: This is not a security vulnerability.
          required: true
        - label: I have removed credentials, tokens and private paths from anything pasted above.
          required: true
