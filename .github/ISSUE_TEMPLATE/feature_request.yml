name: Feature request
description: Something Zeus should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Zeus makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: A rough shape is fine. Say what the CLI or output would look like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: >-
            As far as I can tell this does not require weakening resource limits,
            sandboxing, reviewer independence, or the consent rules in setup.
